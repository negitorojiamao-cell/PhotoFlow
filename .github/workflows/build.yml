name: PhotoFlow builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE bundle
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        shell: pwsh
        run: flutter create --project-name photoflow --platforms=windows .

      - name: Install packages
        run: flutter pub get

      - name: Analyze Dart code
        continue-on-error: true
        run: flutter analyze

      - name: Run widget tests
        continue-on-error: true
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "PhotoFlow-Windows-x64.zip" -Force

      - name: Upload Windows application bundle
        uses: actions/upload-artifact@v4
        with:
          name: PhotoFlow-Windows-x64
          path: PhotoFlow-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build Android APK bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        run: flutter create --project-name photoflow --platforms=android .

      - name: Install packages
        run: flutter pub get

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Package APK
        run: zip PhotoFlow-Android-APK.zip build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android APK bundle
        uses: actions/upload-artifact@v4
        with:
          name: PhotoFlow-Android-APK
          path: PhotoFlow-Android-APK.zip
          if-no-files-found: error
          retention-days: 14
