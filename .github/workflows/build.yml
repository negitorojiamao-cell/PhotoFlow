name: PhotoFlow Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        shell: pwsh
        run: flutter create --project-name photoflow --platforms=windows .

      - name: Install packages
        run: flutter pub get

      - name: Analyze Dart code
        continue-on-error: true
        run: flutter analyze

      - name: Run widget tests
        continue-on-error: true
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows application bundle
        uses: actions/upload-artifact@v4
        with:
          name: PhotoFlow-Windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
